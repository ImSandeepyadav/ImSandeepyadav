<style>
.t { font-family: 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', 'Coming Soon', casual, cursive; }

.w { fill: none; stroke: #1F1F2E; stroke-width: 6.6; stroke-linecap: round; stroke-linejoin: round; animation-name: write; animation-timing-function: linear; animation-fill-mode: both; }
