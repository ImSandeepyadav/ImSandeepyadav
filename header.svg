.jitter { transform-box: view-box; transform-origin: 180px 200px; animation: jitter .45s step-end infinite; }
@keyframes jitter { 0% { transform: translate(0px, 0px) rotate(0deg); } 33% { transform: translate(.6px, -.4px) rotate(.4deg); } 66% { transform: translate(-.5px, .4px) rotate(-.3deg); } 100% { transform: translate(0px, 0px) rotate(0deg); } }
.wave { transform-box: view-box; transform-origin: 214px 172px; animation: wave 3.6s ease-in-out infinite; }
@keyframes wave { 0%, 50%, 100% { transform: rotate(0deg); } 10%, 30% { transform: rotate(-16deg); } 20%, 40% { transform: rotate(10deg); } }
.marks { animation: marks 3.6s step-end infinite; }
@keyframes marks { 0% { opacity: 0; } 8% { opacity: 1; } 44% { opacity: 0; } 100% { opacity: 0; } }
.blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.4s linear infinite; }
@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
.rays { animation: rays 1.4s step-end infinite; }
@keyframes rays { 0% { opacity: 1; } 50% { opacity: .15; } 100% { opacity: 1; } }
.plane { animation: plane 9s ease-in-out infinite; }
@keyframes plane { 0% { transform: translate(230px, 44px) rotate(-6deg); opacity: 0; } 6% { opacity: 1; } 30% { transform: translate(410px, 30px) rotate(5deg); } 55% { transform: translate(590px, 42px) rotate(-6deg); } 80% { transform: translate(770px, 28px) rotate(6deg); } 92% { transform: translate(880px, 36px) rotate(0deg); opacity: 1; } 100% { transform: translate(880px, 36px) rotate(0deg); opacity: 0; } }
.fade { animation: fadeUp .5s ease-out both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0px); } }
.pop { transform-box: fill-box; transform-origin: 50% 50%; animation: pop .45s cubic-bezier(.3, 1.6, .6, 1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
.swipe { transform-box: fill-box; transform-origin: 0% 50%; animation: swipe .45s ease-out both; }
@keyframes swipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.ul { stroke-dasharray: 462.9px 464.9px; animation: draw 0.9s linear 3.80s both; }
@keyframes draw { from { stroke-dashoffset: 463.9px; } to { stroke-dashoffset: 0px; } }
.pencil { animation: pencil 1.25s linear 3.80s both; }
@keyframes pencil { 0% { transform: translate(0px, 0px); opacity: 0; } 3% { opacity: 1; } 7.2% { transform: translate(46.1px, 0.1px); opacity: 1; } 14.4% { transform: translate(92.2px, 3.1px); opacity: 1; } 21.6% { transform: translate(138.3px, 3.2px); opacity: 1; } 28.8% { transform: translate(184.4px, 1.1px); opacity: 1; } 36.0% { transform: translate(230.6px, 1.7px); opacity: 1; } 43.2% { transform: translate(276.7px, 0.8px); opacity: 1; } 50.4% { transform: translate(322.9px, 2.3px); opacity: 1; } 57.6% { transform: translate(369.0px, 2.1px); opacity: 1; } 64.8% { transform: translate(415.1px, -0.6px); opacity: 1; } 72.0% { transform: translate(461.2px, -0.4px); opacity: 1; } 100% { transform: translate(477.2px, -18.4px); opacity: 0; } }
.drop { animation: drop .6s cubic-bezier(.3, 1.4, .6, 1) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0px); } }
.flag { transform-box: fill-box; transform-origin: 0% 50%; animation: flag 1.6s ease-in-out infinite; }
@keyframes flag { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(.94); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .w, .ul { stroke-dasharray: none !important; stroke-dashoffset: 0px !important; }
  .plane, .pencil { visibility: hidden; }
}

