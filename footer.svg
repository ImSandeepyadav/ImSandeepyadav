<title>Thanks for stopping by!</title>
<style>
.t { font-family: 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', 'Coming Soon', casual, cursive; }

.curl { transform-box: fill-box; transform-origin: 0% 0%; animation: curl 2.4s ease-in-out infinite; }
@keyframes curl { 0%, 100% { transform: rotate(0deg); } 35%, 50% { transform: rotate(-118deg); } 85% { transform: rotate(0deg); } }
.sweat { opacity: 0; animation: sweat 2.4s ease-in infinite; }
@keyframes sweat { 0%, 32% { opacity: 0; transform: translateY(0px); } 42% { opacity: 1; transform: translateY(0px); } 62% { opacity: 1; transform: translateY(6px); } 72%, 100% { opacity: 0; transform: translateY(8px); } }
.blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.4s linear infinite; }
@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
